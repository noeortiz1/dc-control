<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Control</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0F4C81, #12395B);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 420px;
      padding: 40px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 32px;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .status {
      font-size: 14px;
      font-weight: 600;
    }

    .version {
      margin-top: 35px;
      font-size: 10px;
      opacity: 0.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="logo" src="logo.png" onerror="this.style.display='none'">

    <div class="title">DC Control</div>

    <div class="subtitle">
      Trazabilidad y Gobernabilidad Comercial
    </div>

    <div class="loader"></div>

    <div class="status">
      Conectando con el sistema...
    </div>

    <div class="version">
      DC Control v1
    </div>
  </div>
</body>
</html>
